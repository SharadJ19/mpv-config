profile=fast
hwdec=auto
use-filedir-conf
save-position-on-quit=yes

osc=no
osd-bar=no
osd-font='Inter'

volume=100
volume-max=200

alang=ja,jpn,en,eng,und
slang=en,eng,enUS,und

# Base (also used until the first aspect is known)
sub-font='Inter'
sub-font-size=38
sub-outline-size=2.4
sub-color='#F0E8DC'
sub-outline-color='#0A0A0A'
sub-margin-x=70
sub-margin-y=46
sub-use-margins=no
#sub-fonts-dir=/storage/emulated/0/Android/media/is.xyz.mpv/fonts

screenshot-directory=~/Downloads
watch-later-options=start

# 4:3 / Academy (< 1.55)
[aspect-narrow]
profile-cond=p["video-out-params/aspect"] and p["video-out-params/aspect"] < 1.55
sub-font-size=36
sub-outline-size=2.3
sub-margin-x=40
sub-margin-y=44

# 1.66:1 European Flat
[aspect-166]
profile-cond=p["video-out-params/aspect"] and p["video-out-params/aspect"] >= 1.55 and p["video-out-params/aspect"] < 1.72
sub-font-size=37
sub-outline-size=2.3
sub-margin-x=50
sub-margin-y=44

# 16:9 (1.72 - 1.80), same values as the base, set explicitly
[aspect-169]
profile-cond=p["video-out-params/aspect"] and p["video-out-params/aspect"] >= 1.72 and p["video-out-params/aspect"] <= 1.80
sub-font-size=38
sub-outline-size=2.4
sub-margin-x=70
sub-margin-y=46

# 1.85:1 Theatrical Flat
[aspect-185]
profile-cond=p["video-out-params/aspect"] and p["video-out-params/aspect"] > 1.80 and p["video-out-params/aspect"] <= 1.95
sub-font-size=35
sub-outline-size=2.2
sub-margin-x=60
sub-margin-y=34

# 2.00:1 Univisium / Streaming
[aspect-200]
profile-cond=p["video-out-params/aspect"] and p["video-out-params/aspect"] > 1.95 and p["video-out-params/aspect"] <= 2.20
sub-font-size=33
sub-outline-size=2.1
sub-margin-x=58
sub-margin-y=30

# 2.35:1 - 2.40:1 Scope
[aspect-scope]
profile-cond=p["video-out-params/aspect"] and p["video-out-params/aspect"] > 2.20 and p["video-out-params/aspect"] <= 2.50
sub-font-size=30
sub-outline-size=2.0
sub-margin-x=54
sub-margin-y=24

# 2.55:1 - 2.76:1 Ultra-Scope
[aspect-ultra]
profile-cond=p["video-out-params/aspect"] and p["video-out-params/aspect"] > 2.50
sub-font-size=28
sub-outline-size=1.9
sub-margin-x=50
sub-margin-y=20